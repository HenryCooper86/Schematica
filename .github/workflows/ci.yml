name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment gate and rollback tests
        run: python3 -m unittest discover -s tests/deploy
      - name: Unit tests
        run: npm test
      - name: Source lint and module reachability
        run: npm run lint
      - name: Browser smoke test (headless Chrome over the DevTools Protocol)
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Recovery and engineering workflow checks
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WORKFLOW_E2E_ONLY: '1'
      - name: Presentation and offline story flows
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PRESENTATION_E2E_ONLY: '1'
      - name: Blueprint and assistant skill flows
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SKILLS_E2E_ONLY: '1'
      - name: Assistant web source reading
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WEB_E2E_ONLY: '1'
      - name: Responsive dialogs and menus
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LAYOUT_E2E_ONLY: '1'
      - name: Visual previews and incremental rendering
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ENHANCEMENTS_E2E_ONLY: '1'
      - name: Retain Chrome failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-failure-evidence
          path: .acceptance/chrome/
          include-hidden-files: true
          retention-days: 14

  firefox:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ github.token }}
      - name: Native Firefox workflows
        run: npm run e2e:firefox
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
      - name: Retain Firefox failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-failure-evidence
          path: .acceptance/firefox/
          include-hidden-files: true
          retention-days: 14
