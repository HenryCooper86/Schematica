name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment gate and rollback tests
        run: python3 -m unittest discover -s tests/deploy
      - name: Unit tests
        run: npm test
      - name: Browser smoke test (headless Chrome over the DevTools Protocol)
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Recovery and engineering workflow checks
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WORKFLOW_E2E_ONLY: '1'
      - name: Presentation and offline story flows
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PRESENTATION_E2E_ONLY: '1'
