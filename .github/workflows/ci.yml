name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment gate and rollback tests
        run: python3 -m unittest discover -s tests/deploy
      - name: Unit tests
        run: npm test
      - name: Source lint and module reachability
        run: npm run lint
      # CJK fonts for the multilingual report PDF checks. The Ubuntu mirror
      # stalls on this 61 MB package now and then, so the extracted font
      # files are cached in the user font directory (fontconfig and Chrome
      # read it) and the mirror is only contacted on a cache miss.
      - name: Restore cached CJK fonts
        id: cjk-fonts
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: fonts-noto-cjk-ubuntu-22.04-v1
      - name: Download CJK fonts (cache miss only)
        if: steps.cjk-fonts.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          cd "$RUNNER_TEMP"
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 download fonts-noto-cjk
          dpkg-deb -x fonts-noto-cjk_*.deb fonts-noto-cjk
          mkdir -p ~/.local/share/fonts/noto-cjk
          find fonts-noto-cjk -type f \( -name '*.ttc' -o -name '*.otf' -o -name '*.ttf' \) -exec cp {} ~/.local/share/fonts/noto-cjk/ \;
          # The package's fontconfig rule ranks the right regional variant
          # (Simplified Chinese for zh-CN); keep it with the cached fonts.
          cp fonts-noto-cjk/usr/share/fontconfig/conf.avail/70-fonts-noto-cjk.conf ~/.local/share/fonts/noto-cjk/
      - name: Save CJK fonts to the cache
        if: steps.cjk-fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: fonts-noto-cjk-ubuntu-22.04-v1
      - name: Register CJK fonts
        run: |
          mkdir -p ~/.config/fontconfig/conf.d
          cp ~/.local/share/fonts/noto-cjk/70-fonts-noto-cjk.conf ~/.config/fontconfig/conf.d/
          fc-cache -f ~/.local/share/fonts
          fc-match 'sans-serif:lang=zh-cn' family
          test -n "$(fc-list :lang=zh)"
      - name: Browser smoke test (headless Chrome over the DevTools Protocol)
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Recovery and engineering workflow checks
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WORKFLOW_E2E_ONLY: '1'
      - name: Presentation and offline story flows
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PRESENTATION_E2E_ONLY: '1'
      - name: Blueprint and assistant skill flows
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SKILLS_E2E_ONLY: '1'
      - name: Assistant web source reading
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WEB_E2E_ONLY: '1'
      - name: Responsive dialogs and menus
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LAYOUT_E2E_ONLY: '1'
      - name: Visual previews and incremental rendering
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ENHANCEMENTS_E2E_ONLY: '1'
      - name: Retain Chrome failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-failure-evidence
          path: .acceptance/chrome/
          include-hidden-files: true
          retention-days: 14

  firefox:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ github.token }}
      - name: Native Firefox workflows
        run: npm run e2e:firefox
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
      - name: Retain Firefox failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-failure-evidence
          path: .acceptance/firefox/
          include-hidden-files: true
          retention-days: 14
