name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Browser smoke test (headless Chrome over the DevTools Protocol)
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
